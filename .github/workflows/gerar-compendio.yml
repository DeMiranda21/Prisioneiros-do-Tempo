name: Gerar Compêndio

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
  
permissions:
  contents: write

jobs:
  gerar:

    # Não executa quando o commit foi feito pelo próprio bot
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar Compêndio
        run: |
          python scripts/gerar_compendio.py

      - name: Commit das alterações
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Atualiza compêndio automaticamente
          file_pattern: Prisioneiros-do-Tempo-Compendio.md
