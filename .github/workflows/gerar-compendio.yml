name: Gerar Compêndio

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "*.md"
      - "scripts/gerar_compendio.py"

permissions:
  contents: write

jobs:
  gerar:
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar compêndio
        run: |
          python scripts/gerar_compendio.py

      - name: Commit do compêndio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza compêndio automaticamente"
          file_pattern: Prisioneiros-do-Tempo-Compendio.txt
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
